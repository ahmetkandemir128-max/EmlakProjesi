<!doctype html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Yeni Emlak</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header class="topbar">
    <a class="brand" th:href="@{/}">Emlak Projesi</a>
    <nav>
        <a th:href="@{/}">Emlaklar</a>
        <a th:href="@{/people}">Kisiler</a>
        <a th:href="@{/deals}">Islemler</a>
        <a th:href="@{/reports}">Raporlar</a>
        <a class="button" th:href="@{/properties/new}">Yeni Emlak</a>
    </nav>
</header>

<main class="page narrow">
    <section class="panel">
        <div class="section-title">
            <h1>Yeni Emlak Kaydi</h1>
        </div>
        <form class="grid-form" method="post" th:action="@{/properties}" th:object="${property}">
            <label class="wide">Baslik
                <input type="text" th:field="*{title}" required>
                <span class="field-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}">Hata</span>
            </label>
            <label>Tur
                <select th:field="*{type}" required>
                    <option value="">Seciniz</option>
                    <option th:each="type : ${types}" th:value="${type}" th:text="${type.label}">Tur</option>
                </select>
                <span class="field-error" th:if="${#fields.hasErrors('type')}" th:errors="*{type}">Hata</span>
            </label>
            <label>Durum
                <select th:field="*{status}" required>
                    <option value="">Seciniz</option>
                    <option th:each="status : ${statuses}" th:value="${status}" th:text="${status.label}">Durum</option>
                </select>
                <span class="field-error" th:if="${#fields.hasErrors('status')}" th:errors="*{status}">Hata</span>
            </label>
            <label>Il
                <input type="text" th:field="*{city}" required>
                <span class="field-error" th:if="${#fields.hasErrors('city')}" th:errors="*{city}">Hata</span>
            </label>
            <label>Ilce
                <input type="text" th:field="*{district}" required>
                <span class="field-error" th:if="${#fields.hasErrors('district')}" th:errors="*{district}">Hata</span>
            </label>
            <label>Fiyat
                <input type="number" min="0" step="0.01" inputmode="decimal" th:field="*{price}" required>
                <span class="field-error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}">Hata</span>
            </label>
            <label>Metrekare
                <input type="number" min="1" step="1" inputmode="numeric" th:field="*{squareMeters}" required>
                <span class="field-error" th:if="${#fields.hasErrors('squareMeters')}" th:errors="*{squareMeters}">Hata</span>
            </label>
            <label>Oda Sayisi
                <input type="number" min="0" step="1" inputmode="numeric" th:field="*{roomCount}">
                <span class="field-error" th:if="${#fields.hasErrors('roomCount')}" th:errors="*{roomCount}">Hata</span>
            </label>
            <label>Sahip
                <select th:field="*{owner}" required>
                    <option value="">Seciniz</option>
                    <option th:each="person : ${people}" th:value="${person.id}" th:text="${person.fullName + ' - ' + person.role.label}">Sahip</option>
                </select>
                <span class="field-error" th:if="${#fields.hasErrors('owner')}" th:errors="*{owner}">Hata</span>
            </label>
            <label class="wide">Adres
                <textarea rows="4" th:field="*{address}"></textarea>
                <span class="field-error" th:if="${#fields.hasErrors('address')}" th:errors="*{address}">Hata</span>
            </label>
            <div class="actions wide">
                <a class="secondary" th:href="@{/}">Vazgec</a>
                <button type="submit">Kaydet</button>
            </div>
        </form>
    </section>
</main>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
